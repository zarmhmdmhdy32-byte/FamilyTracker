      - name: Restore Firebase config
        env:
          CHILD: ${{ secrets.CHILD_GOOGLE_SERVICES_JSON_B64 }}
          PARENT: ${{ secrets.PARENT_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "Checking Firebase secrets..."

          if [ -z "$CHILD" ]; then
            echo "ERROR: CHILD_GOOGLE_SERVICES_JSON_B64 is empty"
            exit 1
          fi

          if [ -z "$PARENT" ]; then
            echo "ERROR: PARENT_GOOGLE_SERVICES_JSON_B64 is empty"
            exit 1
          fi

          echo "$CHILD" | base64 --decode > child/google-services.json
          echo "$PARENT" | base64 --decode > parent/google-services.json

          test -s child/google-services.json
          test -s parent/google-services.json

          echo "Firebase configuration restored successfully."
