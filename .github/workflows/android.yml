name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Firebase config
        env:
          CHILD: ${{ secrets.CHILD_GOOGLE_SERVICES_JSON_B64 }}
          PARENT: ${{ secrets.PARENT_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$CHILD" && test -n "$PARENT"
          echo "$CHILD" | base64 -d > child/google-services.json
          echo "$PARENT" | base64 -d > parent/google-services.json

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyTracker-APKs
          path: |
            child/build/outputs/apk/debug/child-debug.apk
            parent/build/outputs/apk/debug/parent-debug.apk
