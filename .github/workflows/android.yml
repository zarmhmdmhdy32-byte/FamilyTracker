name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Restore Firebase config
        env:
          CHILD: ${{ secrets.CHILD_GOOGLE_SERVICES_JSON_B64 }}
          PARENT: ${{ secrets.PARENT_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$CHILD"
          test -n "$PARENT"
          echo "$CHILD" | base64 -d > child/google-services.json
          echo "$PARENT" | base64 -d > parent/google-services.json

      - name: Build APKs
        run: gradle assembleDebug --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FamilyTracker-APKs
          path: |
            child/build/outputs/apk/debug/child-debug.apk
            parent/build/outputs/apk/debug/parent-debug.apk
